			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The iPhone simulator has no paired Apple Watch, so an embedded\n# watchOS app makes installd reject the bundle (\"App installation failed\").\n# Remove the embedded Watch content for simulator builds only; device and\n# App Store builds (iphoneos) keep the watch app intact.\nif [ \"${PLATFORM_NAME}\" = \"iphonesimulator\" ]; then\n  WATCH_DIR=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Watch\"\n  if [ -d \"${WATCH_DIR}\" ]; then\n    echo \"Stripping embedded Watch content for simulator: ${WATCH_DIR}\"\n    rm -rf \"${WATCH_DIR}\"\n  fi\nfi\n";
